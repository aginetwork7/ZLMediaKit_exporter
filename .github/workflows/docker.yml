name: Docker build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on:
      group: default
    env:
      PROJECT_ID: zlm-exporter
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Determine if tag is on main branch
        run: |
          TAG_COMMIT=$(git rev-parse $GITHUB_REF)
          if git merge-base --is-ancestor $TAG_COMMIT origin/main; then
            echo "IS_MAIN=true" >> $GITHUB_ENV
          else
            echo "IS_MAIN=false" >> $GITHUB_ENV
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.IMAGES_REGISTRY }}
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: "${{ vars.IMAGES_REGISTRY }}/${{ env.PROJECT_ID }}"
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ env.IS_MAIN }}

      - name: Prepare build vars
        id: vars
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git branch -r --contains HEAD | grep -v HEAD | head -1 | sed 's#.*origin/##')" >> $GITHUB_OUTPUT
          echo "time=$(date -u -d @$(git show -s --format=%ct HEAD) +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Docker push
        id: docker_push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            COMMIT_SHA=${{ steps.vars.outputs.commit }}
            BRANCH=${{ steps.vars.outputs.branch }}
            BUILD_DATE=${{ steps.vars.outputs.time }}
          file: Dockerfile

      - name: Image digest
        run: |
          echo "image digest: ${{ steps.docker_push.outputs.digest }}"
